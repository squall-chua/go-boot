name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        # gofmt -l names the unformatted files and still exits 0, so the
        # output has to be the failure signal.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: base imports no Starter
        # Assertion 1 of the import-leak check in docs/spec.md 8.1. go list
        # -deps alone misses test imports, and it is test imports that go mod
        # tidy leaks through, so ask for them by name. The other three
        # assertions, and the golden module counts, are #32.
        run: |
          leaks="$(go list -f '{{join .Imports "\n"}}{{"\n"}}{{join .TestImports "\n"}}{{"\n"}}{{join .XTestImports "\n"}}' . \
            | grep '^github.com/squall-chua/go-boot/' || true)"
          if [ -n "$leaks" ]; then
            echo "the base package or its tests import a Starter:"
            echo "$leaks" | sort -u
            exit 1
          fi
          echo "base package and its tests import no Starter"

      - name: vet
        run: go vet ./...

      - name: the pool is neutral about the query layer
        # ADR 0009, checked by compiling. ent and gorm are built in a
        # throwaway module, because docs/spec.md 7 fixes go-boot's dependency
        # list and neither is on it.
        run: .github/check-query-layer-neutrality.sh

      - name: cache the PostgreSQL test binaries
        # goboot/db/dbtest starts a real PostgreSQL. Measured on linux/amd64:
        # a 14 MB download and 71 MB on disk. Without this it is pulled from
        # Maven Central on every run, which puts a third-party host in the
        # path of the whole test job.
        uses: actions/cache@v4
        with:
          path: |
            ~/.embedded-postgres-go
            ~/.cache/go-boot/embedded-postgres
          key: embedded-postgres-${{ runner.os }}-18.3.0

      - name: test
        run: go test ./...

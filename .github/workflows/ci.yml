name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        # gofmt -l names the unformatted files and still exits 0, so the
        # output has to be the failure signal.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        # This is also docs/spec.md 8.2, "CI builds both forms of every
        # Preset": examples/full holds preset form and explicit form in one
        # package main, so ./... compiles both. The test step below is
        # stronger — see there.
        run: go build ./...

      - name: the import-leak check
        # docs/spec.md 8.1, all five assertions. Each one was proven to fail
        # against a real injected violation before it was trusted to pass;
        # the injections and their output are recorded on #32 and #33.
        run: .github/check-imports.sh

      - name: vet
        run: go vet ./...

      - name: the pool is neutral about the query layer
        # ADR 0009, checked by compiling. ent and gorm are built in a
        # throwaway module, because docs/spec.md 7 fixes go-boot's dependency
        # list and neither is on it.
        run: .github/check-query-layer-neutrality.sh

      - name: cache the PostgreSQL test binaries
        # goboot/db/dbtest starts a real PostgreSQL. Measured on linux/amd64:
        # a 14 MB download and 71 MB on disk. Without this it is pulled from
        # Maven Central on every run, which puts a third-party host in the
        # path of the whole test job.
        uses: actions/cache@v4
        with:
          path: |
            ~/.embedded-postgres-go
            ~/.cache/go-boot/embedded-postgres
          key: embedded-postgres-${{ runner.os }}-18.3.0

      - name: test
        # Carries docs/spec.md 8.2 past a build: examples/full's
        # TestBothFormsServeTheSameService drives the Preset form AND the
        # explicit form against a real PostgreSQL and asserts they serve the
        # same service, so a copy that still compiles but has drifted fails
        # here rather than passing quietly.
        run: go test ./...

# Install the two plugins once, then run `buf generate` whenever proto/ changes:
#
#	go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#	go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
#
# There is no Makefile. go-boot does not own your build tool.
version: v2
managed:
  enabled: false
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/gen
    opt: paths=source_relative
inputs:
  - directory: proto
